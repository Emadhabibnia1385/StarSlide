<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarSlide | پازل ۸ با A*</title>
  <meta name="description" content="بازی پازل ۳×۳ که با الگوریتم A* و هیوریستیک h2 (فاصله منهتن) حل می‌شود.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Star<span>Slide</span></h1>
      <p>پازل ۳×۳ با حل‌کننده‌ی A* و هیوریستیک <b>h2</b></p>
    </header>

    <section class="board" id="board" dir="ltr" aria-label="صفحه پازل"></section>
    <p class="banner" id="banner" hidden></p>

    <section class="controls">
      <button id="newBtn">حالت تصادفی جدید</button>
      <button id="solveBtn" class="primary">حل با A*</button>
      <button id="playBtn" disabled>پخش</button>
      <button id="stepBtn" disabled>گام بعد</button>
      <label class="speed">سرعت
        <select id="speed">
          <option value="900">کند</option>
          <option value="450" selected>متوسط</option>
          <option value="150">تند</option>
        </select>
      </label>
    </section>

    <section class="stats">
      <div><span id="movesStat">۰</span><small>حرکت انجام‌شده</small></div>
      <div><span id="h2Stat">۰</span><small>h2 حالت فعلی</small></div>
      <div><span id="optStat">—</span><small>طول مسیر بهینه</small></div>
      <div><span id="expStat">—</span><small>گره‌های گسترش‌یافته</small></div>
      <div><span id="genStat">—</span><small>گره‌های تولیدشده</small></div>
      <div><span id="timeStat">—</span><small>زمان حل (ms)</small></div>
    </section>

    <section class="solution" id="solutionBox" hidden>
      <h2>دنباله حرکات (جهت حرکت خانه خالی)</h2>
      <ol id="solutionList" dir="ltr"></ol>
    </section>

    <footer>
      روی خانه‌های کنار جای خالی کلیک کنید تا خودتان بازی کنید، یا بگذارید A* بهترین مسیر را پیدا کند.
    </footer>
  </main>

  <script src="js/puzzle.js"></script>
  <script src="js/astar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
